# Publishes index.html to GitHub Pages.
#
# Nothing here needs configuring: `enablement: true` turns the Pages site on
# via the API the first time this runs, so a push to main is the only step.
# GitHub Pages is free for public repositories; on a private repository it
# requires a paid plan and this workflow will fail until the repo is public.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
